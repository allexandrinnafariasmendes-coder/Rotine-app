<!DOCTYPE html>
<html lang="pt-BR" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6c5ce7" />
  <meta name="description" content="Minha Rotina — aplicativo pessoal para organizar o dia, criar hábitos e acompanhar o progresso." />
  <title>Minha Rotina</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__logo" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><path d="M8.4 12.4l2.6 2.6 4.6-5.6"/></svg></span>
        <span class="topbar__title" id="viewTitle">Hoje</span>
      </div>
      <button class="icon-btn" id="themeToggle" type="button" title="Alternar tema" aria-label="Alternar tema"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"/></svg></button>
    </header>

    <main class="view" id="view" tabindex="-1"></main>

    <nav class="tabbar" id="tabbar" aria-label="Navegação principal">
      <a class="tab" href="#/hoje"      data-route="hoje"><span class="tab__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.4M12 19v2.4M21.4 12H19M5 12H2.6M18.6 5.4l-1.7 1.7M7.1 16.9l-1.7 1.7M18.6 18.6l-1.7-1.7M7.1 7.1L5.4 5.4"/></svg></span><span>Hoje</span></a>
      <a class="tab" href="#/rotina"    data-route="rotina"><span class="tab__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.3l3.4 2"/></svg></span><span>Rotina</span></a>
      <a class="tab" href="#/habitos"   data-route="habitos"><span class="tab__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.2 4.9 5.3.6-4 3.6 1.1 5.3-4.6-2.7-4.6 2.7 1.1-5.3-4-3.6 5.3-.6z"/></svg></span><span>Hábitos</span></a>
      <a class="tab" href="#/tarefas"   data-route="tarefas"><span class="tab__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.2l2 2 3.4-3.6M4 16.6l2 2 3.4-3.6M13 7.6h7M13 17h7"/></svg></span><span>Tarefas</span></a>
      <a class="tab" href="#/progresso" data-route="progresso"><span class="tab__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 20V13M9.8 20V8.4M15.2 20v-9M20.5 20V5"/></svg></span><span>Progresso</span></a>
      <a class="tab" href="#/ajustes"   data-route="ajustes"><span class="tab__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="2"/><circle cx="15.5" cy="12" r="2"/><circle cx="8" cy="17" r="2"/></svg></span><span>Ajustes</span></a>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet__grip" aria-hidden="true"></div>
      <h2 class="sheet__title" id="sheetTitle"></h2>
      <form class="sheet__form" id="sheetForm" novalidate></form>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/view-hoje.js"></script>
  <script src="js/view-rotina.js"></script>
  <script src="js/view-habitos.js"></script>
  <script src="js/view-tarefas.js"></script>
  <script src="js/view-progresso.js"></script>
  <script src="js/view-ajustes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
