<!DOCTYPE html>
<html lang="pt-BR" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FBF7F1" />
  <meta name="description" content="Minha Rotina — uma central de vida: dia, agenda, estudos, hábitos, autocuidado e descanso em um só lugar." />
  <title>Minha Rotina</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topo">
      <h1 class="topo__titulo" id="tituloTela">Hoje</h1>
      <div class="topo__acoes">
        <button class="btn-icone" id="btnTema" type="button" title="Alternar tema" aria-label="Alternar tema">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
    </header>

    <main class="tela" id="tela" tabindex="-1"></main>

    <nav class="barra-abas" id="abas" aria-label="Navegação principal">
      <a class="aba" href="#/hoje" data-rota="hoje">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.6L12 4l8 6.6V19a1.4 1.4 0 0 1-1.4 1.4H5.4A1.4 1.4 0 0 1 4 19z"/><path d="M9.6 20.4v-6h4.8v6"/></svg>
        <span>Hoje</span>
      </a>
      <a class="aba" href="#/agenda" data-rota="agenda">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.6h17M8.2 3.4v3M15.8 3.4v3"/></svg>
        <span>Agenda</span>
      </a>
      <a class="aba" href="#/tarefas" data-rota="tarefas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.4l1.9 1.9L9.3 5.8M4 16.8l1.9 1.9 3.4-3.5M12.6 7.6h7.4M12.6 17h7.4"/></svg>
        <span>Tarefas</span>
      </a>
      <a class="aba" href="#/estudos" data-rota="estudos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.4h6.2A1.8 1.8 0 0 1 12 7.2v12a1.5 1.5 0 0 0-1.5-1.5H4z"/><path d="M20 5.4h-6.2A1.8 1.8 0 0 0 12 7.2v12a1.5 1.5 0 0 1 1.5-1.5H20z"/></svg>
        <span>Estudos</span>
      </a>
      <a class="aba" href="#/mais" data-rota="mais">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/></svg>
        <span>Mais</span>
      </a>
    </nav>
  </div>

  <button class="fab" id="fabAssistente" type="button">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3.6l1.7 3.9 3.9 1.7-3.9 1.7L12 14.8l-1.7-3.9L6.4 9.2l3.9-1.7z"/><path d="M18 15.4l.8 1.8 1.8.8-1.8.8-.8 1.8-.8-1.8-1.8-.8 1.8-.8z"/>
    </svg>
    Assistente
  </button>

  <div class="fundo-painel" id="fundoPainel" hidden>
    <section class="painel" id="painel" role="dialog" aria-modal="true" aria-labelledby="painelTitulo">
      <div class="painel__puxador" aria-hidden="true"></div>
      <h2 class="painel__titulo" id="painelTitulo"></h2>
      <form class="painel__form" id="painelForm" novalidate></form>
    </section>
  </div>

  <div class="recado" id="recado" role="status" aria-live="polite" hidden></div>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/motor.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/view-hoje.js"></script>
  <script src="js/view-agenda.js"></script>
  <script src="js/view-tarefas.js"></script>
  <script src="js/view-estudos.js"></script>
  <script src="js/view-objetivos.js"></script>
  <script src="js/view-habitos.js"></script>
  <script src="js/view-autocuidado.js"></script>
  <script src="js/view-espiritual.js"></script>
  <script src="js/view-semana.js"></script>
  <script src="js/view-assistente.js"></script>
  <script src="js/view-mais.js"></script>
  <script src="js/view-ajustes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
